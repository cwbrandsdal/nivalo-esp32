; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
	
	; Dependency versions are fixed below for reproducible CI and local builds.

[env:featheresp32]
platform = espressif32@7.0.1
board = featheresp32
upload_port = COM6
monitor_port = COM6
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-DARDUINO_LOOP_STACK_SIZE=24576
	-DNIVALO_HAS_SECONDARY_MCU=1
	-I../../third_party/adafruit-dap-nivalo/source
board_upload.flash_size = 4MB
board_upload.maximum_size = 1310720
lib_deps = 
	symlink://../..
	symlink://../../third_party/adafruit-dap-nivalo/source
	knolleary/PubSubClient@2.8
	bblanchon/ArduinoJson@6.21.6
	adafruit/Adafruit NeoPixel@1.15.5
	adafruit/Adafruit SPIFlash@5.1.1
	adafruit/Adafruit TinyUSB Library@3.7.7
	adafruit/SdFat - Adafruit Fork@2.3.103
	fortyseveneffects/MIDI Library@5.0.2
