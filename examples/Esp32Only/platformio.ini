[env:featheresp32]
platform = espressif32@7.0.1
board = featheresp32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=24576
lib_deps =
    symlink://../..
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.6
    adafruit/Adafruit NeoPixel@1.15.5

[env:featheresp32-browser-provisioning]
extends = env:featheresp32
board_build.partitions = partitions/nivalo-provisioning-4mb-v1.csv
build_flags =
    ${env:featheresp32.build_flags}
    -DNIVALO_BROWSER_FLASH_ARTIFACT=1
    -DNIVALO_BROWSER_FLASH_ALLOW_UNENCRYPTED_NVS_FOR_EVALUATION=1
extra_scripts = post:../../scripts/browser_flash_platformio.py

[env:nodemcu-32s-phase1-bench]
extends = env:featheresp32
board = nodemcu-32s
upload_port = COM6
monitor_port = COM6
