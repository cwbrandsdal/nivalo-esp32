; Product identity per environment (specs/cloud-mqtt-v1.1.md section 11.2). Staging and
; production use different product IDs, so an image signed for one never installs in the other.
; Raise security_version with every release.
[nivalo]
staging_product_id = 064c6fb6-a7f6-4646-87e3-5df87e8634f1
production_product_id = 66f13a6e-6d3c-48ef-845c-86f18297e55b
security_version = 1

; Staging (the default development target).
[env:featheresp32]
platform = espressif32@7.0.1
board = featheresp32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=24576
    -DNIVALO_PRODUCT_ID=\"${nivalo.staging_product_id}\"
    -DNIVALO_SECURITY_VERSION=${nivalo.security_version}
    -DNIVALO_API_ORIGIN=\"https://iot-api-staging.nivalo.io\"
lib_deps =
    symlink://../..
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.6
    adafruit/Adafruit NeoPixel@1.15.5

[env:featheresp32-browser-provisioning]
extends = env:featheresp32
board_build.partitions = partitions/nivalo-provisioning-4mb-v1.csv
build_flags =
    ${env:featheresp32.build_flags}
    -DNIVALO_BROWSER_FLASH_ARTIFACT=1
    -DNIVALO_BROWSER_FLASH_ALLOW_UNENCRYPTED_NVS_FOR_EVALUATION=1
extra_scripts = post:../../scripts/browser_flash_platformio.py

[env:featheresp32-production]
extends = env:featheresp32
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=24576
    -DNIVALO_PRODUCT_ID=\"${nivalo.production_product_id}\"
    -DNIVALO_SECURITY_VERSION=${nivalo.security_version}
    -DNIVALO_API_ORIGIN=\"https://iot-api.nivalo.io\"

; Direct-flash NodeMCU-32S build. It is never a browser-flash artifact.
[env:nodemcu-32s]
extends = env:featheresp32
board = nodemcu-32s
