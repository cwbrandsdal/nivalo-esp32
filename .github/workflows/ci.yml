name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NIVALO_PROTOCOL_REF: 5530ea195ae97f5d3ea9e7a24509206ed80cea86
  NIVALO_PROTOCOL_DIR: ${{ github.workspace }}/.ci/nivalo-protocol

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Require immutable private dependency key
        env:
          NIVALO_PROTOCOL_DEPLOY_KEY: ${{ secrets.NIVALO_PROTOCOL_DEPLOY_KEY }}
        run: |
          [[ "$NIVALO_PROTOCOL_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$NIVALO_PROTOCOL_DEPLOY_KEY" ]]
      - name: Check out authoritative protocol contracts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: cwbrandsdal/nivalo-protocol
          ref: ${{ env.NIVALO_PROTOCOL_REF }}
          path: .ci/nivalo-protocol
          ssh-key: ${{ secrets.NIVALO_PROTOCOL_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python tools
        run: python -m pip install --disable-pip-version-check platformio==6.1.19 cryptography==46.0.7 jsonschema==4.25.1 rfc3339-validator==0.1.4
      - name: Host behavior tests
        run: |
          cmake -S tests/host -B build/host -DCMAKE_BUILD_TYPE=Release -DNIVALO_PROTOCOL_DIR="$NIVALO_PROTOCOL_DIR"
          cmake --build build/host --parallel
          ctest --test-dir build/host --output-on-failure
      - name: Claim and provenance checks
        run: |
          python tests/validate_provisioning.py
          python tests/validate_cli_serial.py
          python tests/validate_serial_claim_contract.py
          python tests/validate_dap_fork.py
          python tests/validate_registry_release.py
      - name: Artifact and archive tooling tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Arduino library structure lint
        run: |
          lint_dir="$RUNNER_TEMP/arduino-lint-1.3.0"
          mkdir -p "$lint_dir"
          curl --fail --silent --show-error --location \
            --output "$lint_dir/arduino-lint.tar.gz" \
            https://github.com/arduino/arduino-lint/releases/download/1.3.0/arduino-lint_1.3.0_Linux_64bit.tar.gz
          echo "181671ca174988f2601e1cdf2b40a552682db8eaa047de33117e67e70338b63e  $lint_dir/arduino-lint.tar.gz" | sha256sum --check --strict
          tar -xzf "$lint_dir/arduino-lint.tar.gz" -C "$lint_dir" arduino-lint
          "$lint_dir/arduino-lint" --compliance specification --library-manager=false --project-type library --recursive=false
      - name: Cache PlatformIO platform and toolchain
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.platformio
          key: platformio-6.1.19-${{ runner.os }}-${{ hashFiles('examples/*/platformio.ini') }}
          restore-keys: |
            platformio-6.1.19-${{ runner.os }}-
      - name: Build standalone example
        run: pio run --project-dir examples/Esp32Only --environment featheresp32
      - name: Build ESP32-STM32 bridge example
        run: pio run --project-dir examples/Esp32Stm32Bridge --environment featheresp32
