name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NIVALO_PROTOCOL_REF: cb25ab0997c02bc7c16f757e685ef209bac22d34
  NIVALO_PROTOCOL_DIR: ${{ github.workspace }}/.ci/nivalo-protocol

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      registry_portability: ${{ steps.classify.outputs.registry_portability }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Classify registry portability changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          force_all=false
          paths=''
          case "$EVENT_NAME" in
            workflow_dispatch)
              force_all=true
              ;;
            pull_request)
              if git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null && \
                 git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null; then
                paths=$(git diff --name-only --no-renames --diff-filter=ACDMRTUXB \
                  "$PR_BASE_SHA...$PR_HEAD_SHA")
              else
                force_all=true
              fi
              ;;
            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || \
                 ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                force_all=true
              else
                paths=$(git diff --name-only --no-renames --diff-filter=ACDMRTUXB \
                  "$BEFORE_SHA" "$CURRENT_SHA")
              fi
              ;;
            *)
              force_all=true
              ;;
          esac

          if [[ "$force_all" == false && -z "$paths" ]]; then
            force_all=true
          fi

          registry_portability=$force_all
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              .github/workflows/ci.yml|library.json|library.properties|README.md|LICENSE|src/*|examples/*|third_party/adafruit-dap-nivalo/*|scripts/prepare_registry_release.py|scripts/pack_registry_archive.py|scripts/verify_registry_archives.py|tests/validate_registry_release.py|tests/test_pack_registry_archive.py|tests/test_verify_registry_archives.py)
                registry_portability=true
                ;;
            esac
          done <<< "$paths"

          echo "registry_portability=$registry_portability" >> "$GITHUB_OUTPUT"
          {
            echo '## Registry portability classification'
            echo
            echo "- Run Windows portability: $registry_portability"
          } >> "$GITHUB_STEP_SUMMARY"

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Configure host behavior tests
        run: cmake -S tests/host -B build/host -DCMAKE_BUILD_TYPE=Release
      - name: Build host behavior tests
        run: cmake --build build/host --parallel
      - name: Run host behavior tests
        run: ctest --test-dir build/host --output-on-failure

  platformio-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Require immutable private dependency key
        env:
          NIVALO_PROTOCOL_DEPLOY_KEY: ${{ secrets.NIVALO_PROTOCOL_DEPLOY_KEY }}
        run: |
          [[ "$NIVALO_PROTOCOL_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$NIVALO_PROTOCOL_DEPLOY_KEY" ]]
      - name: Check out authoritative protocol contracts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: cwbrandsdal/nivalo-protocol
          ref: ${{ env.NIVALO_PROTOCOL_REF }}
          path: .ci/nivalo-protocol
          ssh-key: ${{ secrets.NIVALO_PROTOCOL_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate secure MQTT defaults
        run: python tests/validate_tls_defaults.py
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check cryptography==46.0.7 jsonschema==4.25.1
      - name: Validate firmware trust and recovery fixtures
        run: python tests/validate_firmware_security.py
      - name: Validate SDK extensibility contract
        run: python tests/validate_sdk_extensibility.py
      - name: Validate firmware architecture
        run: python tests/validate_architecture.py
      - name: Validate maintained Adafruit DAP fork
        run: python tests/validate_dap_fork.py
      - name: Validate registry release readiness
        run: |
          python tests/validate_registry_release.py
          python -m unittest discover -s tests -p 'test_pack_registry_archive.py'
          python -m unittest discover -s tests -p 'test_verify_registry_archives.py'
      - name: Validate Arduino library specification
        run: |
          lint_dir="$RUNNER_TEMP/arduino-lint-1.3.0"
          mkdir -p "$lint_dir"
          curl --fail --silent --show-error --location \
            --output "$lint_dir/arduino-lint.tar.gz" \
            https://github.com/arduino/arduino-lint/releases/download/1.3.0/arduino-lint_1.3.0_Linux_64bit.tar.gz
          echo "181671ca174988f2601e1cdf2b40a552682db8eaa047de33117e67e70338b63e  $lint_dir/arduino-lint.tar.gz" | sha256sum --check --strict
          tar -xzf "$lint_dir/arduino-lint.tar.gz" -C "$lint_dir" arduino-lint
          "$lint_dir/arduino-lint" --compliance specification --library-manager=false --project-type library --recursive=false
      - name: Validate runtime provisioning
        run: python tests/validate_provisioning.py
      - name: Validate CLI serial contracts
        run: python tests/validate_cli_serial.py
      - name: Test attended CLI mismatch probe
        run: python -m unittest discover -s tests -p 'test_phase1_cli_mismatch_probe.py'
      - name: Validate pinned platform serial-claim fixture
        run: python tests/validate_serial_claim_contract.py
      - name: Test browser-flash artifact tooling
        run: python -m unittest discover -s tests -p 'test_browser_flash_artifact.py'
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Build standalone example
        run: pio run --project-dir examples/Esp32Only
      - name: Build and inspect original-ESP32 browser provisioning artifact
        run: |
          pio run --project-dir examples/Esp32Only --environment featheresp32-browser-provisioning
          python tests/validate_browser_flash_artifact.py
      - name: Build ESP32-STM32 bridge example
        run: pio run --project-dir examples/Esp32Stm32Bridge
      - name: Build Arduino runtime-provisioning example
        run: >-
          pio ci --lib . --board featheresp32
          --project-option "platform=espressif32@7.0.1"
          --project-option "framework=arduino"
          examples/NivaloRuntimeProvisioning/NivaloRuntimeProvisioning.ino
      - name: Build clean consumers from registry archives
        run: |
          device_tag="$(python scripts/prepare_registry_release.py --package device --identity-field tag)"
          dap_tag="$(python scripts/prepare_registry_release.py --package dap --identity-field tag)"
          device_archive="$(python scripts/prepare_registry_release.py --package device --identity-field archive)"
          dap_archive="$(python scripts/prepare_registry_release.py --package dap --identity-field archive)"
          python scripts/prepare_registry_release.py --package device --tag "$device_tag" --dap-owner nivalo-ci --output .release-stage
          python scripts/prepare_registry_release.py --package dap --tag "$dap_tag" --output .release-stage
          mkdir -p .release-archives
          python scripts/pack_registry_archive.py .release-stage/device --output ".release-archives/$device_archive"
          python scripts/pack_registry_archive.py .release-stage/dap --output ".release-archives/$dap_archive"
          python scripts/verify_registry_archives.py \
            --device ".release-archives/$device_archive" \
            --dap ".release-archives/$dap_archive" \
            --fresh-core-dir "$RUNNER_TEMP/nivalo-registry-platformio-core"

  registry-portability:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.registry_portability == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install immutable PlatformIO verifier
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Validate registry tooling on Windows
        run: |
          python tests/validate_registry_release.py
          python -m unittest discover -s tests -p 'test_pack_registry_archive.py'
          python -m unittest discover -s tests -p 'test_verify_registry_archives.py'
      - name: Build exact registry archives from an empty Windows cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $deviceTag = python scripts/prepare_registry_release.py --package device --identity-field tag
          $dapTag = python scripts/prepare_registry_release.py --package dap --identity-field tag
          $deviceArchive = python scripts/prepare_registry_release.py --package device --identity-field archive
          $dapArchive = python scripts/prepare_registry_release.py --package dap --identity-field archive
          python scripts/prepare_registry_release.py --package device --tag $deviceTag --dap-owner nivalo-ci --output .release-stage
          python scripts/prepare_registry_release.py --package dap --tag $dapTag --output .release-stage
          New-Item -ItemType Directory -Path .release-archives | Out-Null
          python scripts/pack_registry_archive.py .release-stage/device --output ".release-archives/$deviceArchive"
          python scripts/pack_registry_archive.py .release-stage/dap --output ".release-archives/$dapArchive"
          python scripts/verify_registry_archives.py `
            --device ".release-archives/$deviceArchive" `
            --dap ".release-archives/$dapArchive" `
            --fresh-core-dir "$env:RUNNER_TEMP/p"
