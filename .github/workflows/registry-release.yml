name: Registry release

on:
  push:
    tags:
      - "v*"
      - "dap-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to validate or publish
        required: true
        type: choice
        options:
          - device
          - dap
      release_ref:
        description: Existing immutable tag ref, for example refs/tags/v0.2.0
        required: true
        type: string
      publish:
        description: Publish to PlatformIO after validation and environment approval
        required: true
        default: false
        type: boolean
      confirmation:
        description: For publication, enter PUBLISH <package> <tag>
        required: false
        type: string

permissions:
  contents: read

env:
  NIVALO_PROTOCOL_REF: cb25ab0997c02bc7c16f757e685ef209bac22d34
  NIVALO_PROTOCOL_DIR: ${{ github.workspace }}/.ci/nivalo-protocol

concurrency:
  group: registry-release-${{ github.ref }}-${{ inputs.package || 'tag' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.release.outputs.package }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      archive: ${{ steps.release.outputs.archive }}
      sha: ${{ steps.release.outputs.sha }}
      checksum: ${{ steps.archive.outputs.checksum }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require immutable private dependency key
        env:
          NIVALO_PROTOCOL_DEPLOY_KEY: ${{ secrets.NIVALO_PROTOCOL_DEPLOY_KEY }}
        run: |
          [[ "$NIVALO_PROTOCOL_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$NIVALO_PROTOCOL_DEPLOY_KEY" ]]
      - name: Check out authoritative protocol contracts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: cwbrandsdal/nivalo-protocol
          ref: ${{ env.NIVALO_PROTOCOL_REF }}
          path: .ci/nivalo-protocol
          ssh-key: ${{ secrets.NIVALO_PROTOCOL_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: release
        name: Resolve immutable release identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_RELEASE_REF: ${{ inputs.release_ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$INPUT_RELEASE_REF" == refs/tags/* ]]
            release_ref="$INPUT_RELEASE_REF"
            tag="${INPUT_RELEASE_REF#refs/tags/}"
            package="$INPUT_PACKAGE"
            publish="$INPUT_PUBLISH"
            if [[ "$publish" == "true" ]]; then
              [[ "$INPUT_CONFIRMATION" == "PUBLISH $package $tag" ]]
            fi
          else
            release_ref="$GITHUB_REF"
            tag="$GITHUB_REF_NAME"
            package=device
            [[ "$tag" == dap-v* ]] && package=dap
            publish=false
          fi
          [[ "$release_ref" == "refs/tags/$tag" ]]
          [[ "$(git rev-parse "$release_ref^{commit}")" == "$(git rev-parse HEAD)" ]]
          expected_tag="$(python scripts/prepare_registry_release.py --package "$package" --identity-field tag)"
          [[ "$tag" == "$expected_tag" ]]
          archive="$(python scripts/prepare_registry_release.py --package "$package" --identity-field archive)"
          sha="$(git rev-parse HEAD)"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Install immutable validation dependencies
        run: python -m pip install --disable-pip-version-check platformio==6.1.19 cryptography==46.0.7 jsonschema==4.25.1
      - name: Require Arduino Library Manager submission compliance
        if: steps.release.outputs.package == 'device' && github.event.repository.private == false
        run: |
          lint_dir="$RUNNER_TEMP/arduino-lint-1.3.0"
          mkdir -p "$lint_dir"
          curl --fail --silent --show-error --location \
            --output "$lint_dir/arduino-lint.tar.gz" \
            https://github.com/arduino/arduino-lint/releases/download/1.3.0/arduino-lint_1.3.0_Linux_64bit.tar.gz
          echo "181671ca174988f2601e1cdf2b40a552682db8eaa047de33117e67e70338b63e  $lint_dir/arduino-lint.tar.gz" | sha256sum --check --strict
          tar -xzf "$lint_dir/arduino-lint.tar.gz" -C "$lint_dir" arduino-lint
          "$lint_dir/arduino-lint" --compliance strict --library-manager submit --project-type library --recursive=false
      - name: Validate firmware and release provenance
        env:
          RELEASE_PACKAGE: ${{ steps.release.outputs.package }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DAP_OWNER: ${{ vars.NIVALO_DAP_PLATFORMIO_OWNER }}
        run: |
          [[ -n "$DAP_OWNER" ]]
          python tests/validate_tls_defaults.py
          python tests/validate_firmware_security.py
          python tests/validate_sdk_extensibility.py
          python tests/validate_architecture.py
          python tests/validate_dap_fork.py
          python tests/validate_provisioning.py
          python -m unittest discover -s tests -p 'test_browser_flash_artifact.py'
          python tests/validate_registry_release.py
          python -m unittest discover -s tests -p 'test_pack_registry_archive.py'
          python -m unittest discover -s tests -p 'test_verify_registry_archives.py'
          device_tag="$(python scripts/prepare_registry_release.py --package device --identity-field tag)"
          dap_tag="$(python scripts/prepare_registry_release.py --package dap --identity-field tag)"
          python scripts/prepare_registry_release.py --package device --tag "$device_tag" --dap-owner "$DAP_OWNER" --output .release-stage
          python scripts/prepare_registry_release.py --package dap --tag "$dap_tag" --output .release-stage
      - name: Build repository examples
        run: |
          pio run --project-dir examples/Esp32Only
          pio run --project-dir examples/Esp32Only --environment featheresp32-browser-provisioning
          python tests/validate_browser_flash_artifact.py
          pio run --project-dir examples/Esp32Stm32Bridge
          pio ci --lib . --board featheresp32 \
            --project-option "platform=espressif32@7.0.1" \
            --project-option "framework=arduino" \
            examples/NivaloRuntimeProvisioning/NivaloRuntimeProvisioning.ino
      - id: archive
        name: Pack and inspect dry-run archive
        env:
          RELEASE_PACKAGE: ${{ steps.release.outputs.package }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          mkdir -p dist
          device_archive="$(python scripts/prepare_registry_release.py --package device --identity-field archive)"
          dap_archive="$(python scripts/prepare_registry_release.py --package dap --identity-field archive)"
          python scripts/pack_registry_archive.py .release-stage/device --output "dist/$device_archive"
          python scripts/pack_registry_archive.py .release-stage/dap --output "dist/$dap_archive"
          [[ -f "dist/$RELEASE_ARCHIVE" ]]
          tar -tzf "dist/$RELEASE_ARCHIVE"
          sha256sum "dist/$RELEASE_ARCHIVE"
          python scripts/verify_registry_archives.py \
            --device "dist/$device_archive" \
            --dap "dist/$dap_archive" \
            --fresh-core-dir "$RUNNER_TEMP/nivalo-registry-platformio-core"
          checksum="$(sha256sum "dist/$RELEASE_ARCHIVE" | cut -d ' ' -f 1)"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Retain exact reviewed archive for the guarded publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-${{ steps.release.outputs.package }}-${{ steps.release.outputs.tag }}
          path: dist/${{ steps.release.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  publish-platformio:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: registry-publication
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install immutable publisher
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Verify immutable tag still identifies the reviewed commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$RELEASE_SHA" ]]
      - name: Retrieve exact reviewed archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-${{ needs.prepare.outputs.package }}-${{ needs.prepare.outputs.tag }}
          path: dist
      - name: Verify reviewed archive checksum
        env:
          RELEASE_ARCHIVE: ${{ needs.prepare.outputs.archive }}
          RELEASE_CHECKSUM: ${{ needs.prepare.outputs.checksum }}
        run: |
          echo "$RELEASE_CHECKSUM  dist/$RELEASE_ARCHIVE" | sha256sum --check --strict
      - name: Publish immutable device archive to PlatformIO
        if: needs.prepare.outputs.package == 'device'
        env:
          RELEASE_ARCHIVE: ${{ needs.prepare.outputs.archive }}
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.NIVALO_DEVICE_PLATFORMIO_AUTH_TOKEN }}
          PACKAGE_OWNER: ${{ vars.NIVALO_DEVICE_PLATFORMIO_OWNER }}
          DAP_OWNER: ${{ vars.NIVALO_DAP_PLATFORMIO_OWNER }}
        run: |
          set -euo pipefail
          [[ -n "$DAP_OWNER" ]]
          [[ -n "$PLATFORMIO_AUTH_TOKEN" ]]
          [[ -n "$PACKAGE_OWNER" ]]
          dap_version="$(python scripts/prepare_registry_release.py --package dap --identity-field version)"
          pio pkg show --type library "$DAP_OWNER/Nivalo Adafruit DAP@$dap_version"
          pio pkg publish "dist/$RELEASE_ARCHIVE" --owner "$PACKAGE_OWNER" --type library --no-interactive --no-notify
      - name: Publish immutable DAP archive to PlatformIO
        if: needs.prepare.outputs.package == 'dap'
        env:
          RELEASE_ARCHIVE: ${{ needs.prepare.outputs.archive }}
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.NIVALO_DAP_PLATFORMIO_AUTH_TOKEN }}
          PACKAGE_OWNER: ${{ vars.NIVALO_DAP_PLATFORMIO_OWNER }}
        run: |
          set -euo pipefail
          [[ -n "$PLATFORMIO_AUTH_TOKEN" ]]
          [[ -n "$PACKAGE_OWNER" ]]
          pio pkg publish "dist/$RELEASE_ARCHIVE" --owner "$PACKAGE_OWNER" --type library --no-interactive --no-notify
